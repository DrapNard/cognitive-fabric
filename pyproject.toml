[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-fabric"
version = "1.0.0"
description = "Modular, resource-bounded cognitive orchestration research platform"
requires-python = ">=3.11"
authors = [{name = "DrapNard"}]
license = {text = "Apache-2.0"}
dependencies = ["msgpack>=1.0,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
dev = ["pytest>=8"]
training = ["torch>=2.2", "transformers>=4.46", "peft>=0.13", "safetensors>=0.4"]

[project.scripts]
cogfabric = "cogfabric.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cogfabric*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
