[package]
name = "cogfabric-wasm-experts-experiment"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[workspace]

[dependencies]
wasmi = { version = "=2.0.0", default-features = false, features = ["std", "validate", "stable", "deterministic", "portable-dispatch"] }

wasmparser = { version = "=0.228.0", default-features = false, features = ["std"] }

sha2 = "0.10"
semver = "1"
uuid = "1"

[dev-dependencies]
wat = "1"

[features]
core-audit = ["dep:cogfabric"]

[dependencies.cogfabric]
path = "../.."
optional = true
