[package]
name = "cogfabric"
default-run = "cogfabric"
version = "1.1.0-alpha.1"
edition = "2021"
authors = ["DrapNard"]
license = "GPL-3.0-only"
description = "Local, resource-bounded cognitive coordination runtime"
build = "build.rs"

[[bin]]
name = "cogfabric"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flatbuffers = "=25.12.19"
hex = "0.4"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled", "backup", "serialize", "hooks", "limits"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync", "signal", "process"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[build-dependencies]
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace]
members = ["crates/cogfabric-server"]
default-members = [".", "crates/cogfabric-server"]
resolver = "2"
