name: Rust checks
on:
  push:
    branches: [main, rust-core, develop/v1.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Compile pinned FlatBuffers compiler
        run: |
          git clone --depth 1 --branch v25.12.19 https://github.com/google/flatbuffers.git /tmp/flatbuffers
          cmake -S /tmp/flatbuffers -B /tmp/flatbuffers/build -DFLATBUFFERS_BUILD_TESTS=OFF
          cmake --build /tmp/flatbuffers/build --target flatc --parallel 2
          echo "/tmp/flatbuffers/build" >> "$GITHUB_PATH"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --all-targets
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --all-targets
      - name: CLI smoke
        run: cargo run -- --home ./test-state self-test
      - name: Offline training preflight tests (no ML dependencies)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s training -p 'test_*.py' -v
