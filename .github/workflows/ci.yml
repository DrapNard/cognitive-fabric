name: Rust checks
on:
  push:
    branches: [main, rust-core, develop/v1.0]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Compile pinned FlatBuffers compiler
        run: |
          bash scripts/build-flatc.sh /tmp/cogfabric-flatc
          echo "FLATC=/tmp/cogfabric-flatc/build/flatc" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --all-targets
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --all-targets
      - name: Check optional GPU library integration
        run: cargo check --locked --workspace --all-targets --features nvml-gpu
      - name: Test GPU protocol and observation boundaries
        run: cargo test --locked -p cogfabric --features nvml-gpu --lib gpu::
      - name: Check reviewed bindings without native compiler
        run: env -u FLATC cargo check --locked --workspace --all-targets
      - name: CLI smoke
        run: cargo run -- --home ./test-state self-test
      - name: Complete local CLI workflow smoke
        run: bash scripts/installed-smoke.sh "$PWD/target/debug/cogfabric"
      - name: Complete offline HTTP workflow smoke
        run: |
          if ! command -v rg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes ripgrep
          fi
          cargo build --workspace --bins
          bash scripts/installed-http-smoke.sh "$PWD/target/debug/cogfabric" "$PWD/target/debug/cogfabric-server"
      - name: Offline security boundary evaluation
        run: cargo run -- --home ./test-state --json security-eval
      - name: Offline training preflight tests (no ML dependencies)
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s training -p 'test_*.py' -v
